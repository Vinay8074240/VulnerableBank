
name: Trivy Container Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Scan Container and Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vulnerablebank:local .

      - name: Scan Container and Generate SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vulnerablebank:local
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Scan Dockerfile Configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '0'
